# Build with the JDK that ships with WPILib.
#
# Without this, Gradle picks whatever JVM launched it (on this machine, Android Studio's JBR 21).
# Two things break under that JVM:
#   - spotless dies with NoSuchMethodError JCTree$JCImport.getQualifiedIdentifier(), because
#     google-java-format uses a javac internal API that was removed after 17;
#   - loading wpiHal.dll kills the test JVM with EXCEPTION_ACCESS_VIOLATION, so any test that
#     touches the HAL (anything reading the FPGA clock) takes the whole suite down.
#
# WPILib's own tooling sets this the same way ("Set VS Code Java Home to FRC Home").
org.gradle.java.home=C:/Users/Public/wpilib/2026/jdk

org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
